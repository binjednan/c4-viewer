name: Publish C4 viewer

on: workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: c4-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the current viewer source
        uses: actions/checkout@v4
      - name: Download the unchanged original drawing resources
        env:
          C4_BASE_URL: https://github.com/binjednan/c4-viewer/releases/download/c4-mobile-2026-10-20/C4-Mobile-Site-2026-10-20.zip
        run: curl --fail --location --retry 3 "$C4_BASE_URL" --output c4-site.zip
      - name: Build the vector viewer and verify resource integrity
        run: python3 scripts/build_verified_site.py --archive c4-site.zip --output _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish the viewer
        id: deployment
        uses: actions/deploy-pages@v4
